# 宿主机 Nginx 站点示例：把整站反代给 poetverse 容器。
# 容器内的 Nginx 已经负责静态资源、SPA 回退和 /api 反代，这里只做入口与 TLS。
#
#   sudo cp deploy/host-nginx.sample.conf /etc/nginx/conf.d/poetverse.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 换成 HTTPS 时用 certbot --nginx -d 你的域名，它会自动补 443 与跳转。

server {
    listen 80;
    server_name poem.example.com;

    # 站点若有上传/导入功能按需调大
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大响应（列表页）直接流式回传，不在宿主机再攒一遍
        proxy_buffering off;
    }
}
